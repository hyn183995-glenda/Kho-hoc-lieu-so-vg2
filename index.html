<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kho học liệu số – Trường TH&THCS Vĩnh Gia 2</title><link rel="icon" href="logo.png"><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef3fa;--card:#fff;--tx:#14233b;--mut:#5c6b82;--bd:#d9e1ee;--acc:#2b7de9}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#1c2027;--tx:#eef2f8;--mut:#9aa7ba;--bd:#2d333d;--acc:#5aa2ff}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#0b2a57}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:2px;background:linear-gradient(90deg,#0b2a57,#1f63c2);padding:8px 14px;box-shadow:0 4px 14px rgba(11,42,87,.35)}
nav .lg{height:38px;width:38px;margin-right:4px;background:#fff;border-radius:50%}nav .nm{color:#fff;margin-right:8px}
nav a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:8px 10px;border-radius:8px;cursor:pointer}
nav a:hover,nav a.on{background:rgba(255,255,255,.2)}
nav a.qt{background:linear-gradient(90deg,#f5b301,#ff7a00);color:#1a1200;margin-left:auto;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.dd{position:relative}.ddm{display:none;position:absolute;top:100%;left:0;min-width:190px;background:var(--card);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.3);padding:6px;z-index:40}
.dd:hover .ddm,.dd.open .ddm{display:block}.ddm a{display:block;color:var(--tx);font-weight:500}.ddm a:hover{background:var(--bg)}
.w{max-width:1100px;margin:0 auto;padding:12px}
.hero{background:linear-gradient(135deg,#0b2a57,#2b7de9);color:#fff;border-radius:18px;padding:24px 14px;text-align:center;box-shadow:0 8px 24px rgba(23,64,122,.35)}
.hero img{height:92px;width:92px;background:#fff;border-radius:50%;padding:3px}.hero h1{margin:8px 0 0;font-size:28px}.hero p{margin:4px 0 0;opacity:.9}
h2{margin:22px 0 8px;font-size:20px;color:var(--acc)}
.g{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.kp>div{background:var(--card);border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.kp .e{font-size:26px}.kp b{display:block;font-size:28px;color:var(--acc)}.kp span{color:var(--mut);font-size:13px}
.tile{display:block;text-decoration:none;color:var(--tx);background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);border-top:4px solid var(--c);transition:transform .15s}
.tile:hover{transform:translateY(-3px)}.ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:27px;background:var(--c);margin-bottom:8px}
.tile b{display:block;font-size:16px}.tile small{color:var(--mut)}.tile .n{font-size:24px;font-weight:700;color:var(--c)}
.pn{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}.pn h3{margin:0 0 8px;font-size:16px}
.br{display:grid;grid-template-columns:120px 1fr 26px;gap:6px;align-items:center;font-size:13px;margin:5px 0}
.br i{background:var(--bg);border-radius:20px;height:12px;overflow:hidden}.br u{display:block;height:100%;background:linear-gradient(90deg,#2b7de9,#17c3b2)}
.tli{display:flex;gap:10px;padding:6px 0;position:relative}.tli>i{flex:0 0 12px;height:12px;border-radius:50%;background:var(--acc);margin-top:5px}
.tli:not(:last-child)::before{content:"";position:absolute;left:5px;top:20px;bottom:-6px;width:2px;background:var(--bd)}
.meta{color:var(--mut);font-size:13px}.empty{text-align:center;color:var(--mut);padding:18px}
.ban{display:flex;gap:12px;align-items:center;background:var(--c);color:#fff;border-radius:16px;padding:16px}.ban .ic{background:rgba(255,255,255,.25);margin:0}.ban h1{margin:0;font-size:22px}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer}.btn.o{background:var(--card);color:var(--acc);border:1px solid var(--bd)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
.item{background:var(--card);border-radius:12px;padding:12px;margin:8px 0;border-left:4px solid var(--acc)}.item h3{margin:0 0 4px;font-size:17px}.item h3 a{color:var(--acc);text-decoration:none}
.tag{display:inline-block;background:var(--bg);border-radius:20px;padding:2px 9px;font-size:12px;margin-right:4px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:18px 0}
@media(min-width:800px){.g.t{grid-template-columns:repeat(4,1fr)}.g.k{grid-template-columns:repeat(4,1fr)}.g.p{grid-template-columns:1fr 1fr}}

.kp .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;margin:0 auto 6px;background:var(--c);box-shadow:0 4px 10px rgba(0,0,0,.2)}
.kp>div{border-bottom:4px solid var(--c)}
.dn{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}.dn svg{color:var(--tx)}
.lg2 div{display:flex;align-items:center;gap:6px;font-size:13px;margin:3px 0}.lg2 i{width:11px;height:11px;border-radius:50%;background:var(--c)}.lg2 b{margin-left:auto;padding-left:14px}
.cols{display:flex;align-items:flex-end;gap:8px;height:170px}.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:12px}
.cols u{display:block;width:100%;background:linear-gradient(180deg,#2b7de9,#17c3b2);border-radius:8px 8px 0 0;min-height:3px}
.tp{display:flex;align-items:center;gap:8px;margin:6px 0}.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2b7de9,#17c3b2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}.tp b{margin-left:auto}
.hero{position:relative;overflow:hidden}.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1)}
.hint{font-size:12px;color:var(--mut);margin:2px 0 8px}
.ug{display:grid;gap:10px;grid-template-columns:1fr 1fr}@media(min-width:800px){.ug{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<nav><img class="lg" src="logo.png" alt="Logo"><b class="nm">Vĩnh Gia 2</b><a href="#home">Trang chủ</a><div class="dd"><a class="ddb">Tổ chuyên môn ▾</a><div class="ddm"><a href="#to1">🌱 Tổ 1</a><a href="#to23">📘 Tổ 2-3</a><a href="#to45">🎒 Tổ 4-5</a><a href="#gvbm">🎨 Tổ GVBM</a><a href="#thcs">🔬 Tổ THCS</a><a href="#vp">🗂️ Tổ Văn phòng</a></div></div><a href="#doan">🚩 Đoàn thanh niên</a><a href="#lidoi">🏅 Liên đội</a><a href="#all">Toàn bộ kho</a><a href="#quantri" class="qt">QUẢN TRỊ - TỔ CHUYỂN ĐỔI SỐ</a></nav><div class="w"><div id="app"></div><footer>Tổ chuyển đổi số · Trường TH&amp;THCS Vĩnh Gia 2</footer></div>
<script src="config.js"></script><script>
const C=window.CONFIG||{},$=id=>document.getElementById(id);let items=[];
const esc=s=>{const d=document.createElement("div");d.textContent=s||"";return d.innerHTML};
const safe=u=>/^https?:\/\//i.test(u)?u:"#";
const dl=id=>"https://drive.google.com/drive/folders/"+id;
const fd=t=>t?new Date(t).toLocaleDateString("vi-VN"):"—";
const DEPTS=[["to1","Tổ 1","🌱","#16a34a"],["to23","Tổ 2-3","📘","#2563eb"],["to45","Tổ 4-5","🎒","#d97706"],["gvbm","Tổ GVBM","🎨","#db2777"],["thcs","Tổ THCS","🔬","#7c3aed"],["vp","Tổ Văn phòng","🗂️","#0891b2"],["doan","Đoàn thanh niên","🚩","#dc2626"],["lidoi","Liên đội","🏅","#ea580c"]];
const CATS=[["Học liệu Tiểu học","📖"],["Học liệu THCS","🎓"],["Bài giảng điện tử","🖥️"],["Video dạy học","🎬"],["Học liệu AI","🧠"],["Ngân hàng câu hỏi","📝"],["Tài liệu STEM","🧪"],["Tài nguyên dùng chung","📂"],["Đoàn thanh niên","🚩"],["Liên đội","🏅"]];
const inD=(x,n)=>x.dept===n||x.cat===n;
const dOf=n=>DEPTS.find(d=>d[1]===n);
function csv(t){const r=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==","){row.push(c);c=""}else if(ch=="\n"){row.push(c);r.push(row);row=[];c=""}else if(ch!="\r")c+=ch}
 if(c||row.length){row.push(c);r.push(row)}return r}
function fromSheet(t){const r=csv(t),h=r.shift().map(x=>x.trim().toLowerCase());
 const g=(a,n)=>{const i=h.findIndex(x=>n.some(k=>x.startsWith(k)));return i<0?"":(a[i]||"").trim()};
 const hasOk=h.some(x=>x.startsWith("duyệt"));
 return r.map(a=>({title:g(a,["tên học liệu"]),cat:g(a,["danh mục"]),kind:g(a,["loại"]),sub:g(a,["môn"]),dept:g(a,["tổ"]),author:g(a,["giáo viên","họ và tên"]),url:(g(a,["đường dẫn","tệp","file"])||"").split(",")[0].trim(),desc:g(a,["mô tả"]),at:Date.parse(g(a,["dấu thời gian","timestamp"]).replace(/(\d+)\/(\d+)\/(\d+)/,"$3-$2-$1"))||0,ok:hasOk?g(a,["duyệt"]):"x"})).filter(x=>x.title&&x.ok).reverse()}

function formUrl(t){let u=C.FORM_URL||"";if(u&&t&&C.FORM_DEPT_ENTRY)u+=(u.includes("?")?"&":"?")+"usp=pp_url&"+C.FORM_DEPT_ENTRY+"="+encodeURIComponent(t);return u||"#"}
function bars(p){const m=Math.max(1,...p.map(x=>x[1]));return p.length?p.map(([n,v])=>`<div class="br"><span>${esc(n)}</span><i><u style="width:${v/m*100}%"></u></i><b>${v}</b></div>`).join(""):'<div class="empty">Chưa có dữ liệu</div>'}
function tline(a){return a.length?a.map(x=>{const d=dOf(x.dept||x.cat);return `<div class="tli"><i></i><div><b>${esc(x.title)}</b><div class="meta">${fd(x.at)} · ${esc(x.author||"—")} · ${d?d[2]+" ":""}${esc(x.dept||x.cat)}</div></div></div>`}).join(""):'<div class="empty">Chưa có dữ liệu</div>'}
function itemsHtml(a){return a.length?a.map(x=>`<div class="item"><h3><a href="${esc(safe(x.url))}" target="_blank" rel="noopener">${esc(x.title)}</a></h3><div><span class="tag">${esc(x.cat)}</span>${x.kind?`<span class="tag">${esc(x.kind)}</span>`:""}${x.sub?`<span class="tag">${esc(x.sub)}</span>`:""}</div>${x.desc?`<div>${esc(x.desc)}</div>`:""}<div class="meta">GV: ${esc(x.author||"—")} · ${fd(x.at)}</div></div>`).join(""):'<div class="empty">Chưa có học liệu nào.</div>'}
function donut(){const tot=items.length||1;let off=0;const sg=DEPTS.map(d=>{const v=items.filter(x=>(x.dept||x.cat)===d[1]).length,p=v/tot*100,c=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="${d[3]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"/>`;off+=p;return c}).join("");
 return `<svg viewBox="0 0 42 42" width="170" height="170"><circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--bd)" stroke-width="6"/>${sg}<text x="21" y="22" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor">${items.length}</text><text x="21" y="27" text-anchor="middle" font-size="3" fill="currentColor">học liệu</text></svg>`}
function months(){const n=new Date(),a=[];for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()+1,1);a.push(["T"+(d.getMonth()+1),items.filter(x=>x.at>=d.getTime()&&x.at<e.getTime()).length])}
 const m=Math.max(1,...a.map(x=>x[1]));return `<div class="cols">${a.map(([l,v])=>`<div><b>${v}</b><u style="height:${v/m*120}px"></u><span>${l}</span></div>`).join("")}</div>`}
function home(){
 const n=new Date(),m0=new Date(n.getFullYear(),n.getMonth(),1).getTime(),cnt={};
 items.forEach(x=>{if(x.author)cnt[x.author]=(cnt[x.author]||0)+1});
 const k=(e,v,l,c)=>`<div style="--c:${c}"><div class="ico">${e}</div><b>${v}</b><span>${l}</span></div>`;
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
 $("app").innerHTML=`<div class="hero"><img src="logo.png" alt="Logo"><h1>KHO HỌC LIỆU SỐ</h1><p>TRƯỜNG TH&amp;THCS VĨNH GIA 2 · AN GIANG</p></div>
 <h2>📊 Bảng thống kê</h2><div class="g k kp">${k("📚",items.length,"Tổng học liệu","#2b7de9")}${k("🏫",new Set(items.map(x=>x.dept).filter(Boolean)).size,"Bộ phận đã đăng","#16a34a")}${k("👩‍🏫",Object.keys(cnt).length,"Giáo viên đóng góp","#d97706")}${k("🆕",items.filter(x=>x.at>=m0).length,"Đăng trong tháng","#db2777")}</div>
 <h2>🏫 Kho học liệu theo bộ phận <small class="meta">(bấm để vào kho)</small></h2><div class="g t">${DEPTS.map(([id,nm,ic,c])=>{const l=items.filter(x=>inD(x,nm));return `<a class="tile" href="#${id}" style="--c:${c}"><div class="ic">${ic}</div><b>${nm}</b><div class="n">${l.length}</div><small>Mới nhất: ${fd(l[0]&&l[0].at)}</small></a>`}).join("")}</div>
 <div class="g p" style="margin-top:12px"><div class="pn"><h3>🥧 Tỉ lệ học liệu theo bộ phận</h3><div class="dn">${donut()}<div class="lg2">${DEPTS.map(d=>`<div style="--c:${d[3]}"><i></i>${d[1]}<b>${items.filter(x=>(x.dept||x.cat)===d[1]).length}</b></div>`).join("")}</div></div></div>
 <div class="pn"><h3>📈 Số học liệu đăng 6 tháng gần đây</h3>${months()}</div>
 <div class="pn"><h3>📁 Theo danh mục</h3>${bars(CATS.map(c=>[c[1]+" "+c[0],items.filter(x=>x.cat===c[0]).length]))}</div>
 <div class="pn"><h3>🏆 Giáo viên đóng góp nhiều nhất</h3>${top.length?top.map(([a,v])=>`<div class="tp"><span class="av">${esc(a.trim().split(" ").pop().charAt(0).toUpperCase())}</span>${esc(a)}<b>${v}</b></div>`).join(""):'<div class="empty">Chưa có dữ liệu</div>'}</div></div>
 <div class="pn" style="margin-top:12px"><h3>🕒 Dòng thời gian tải lên gần đây</h3>${tline(items.slice(0,8))}</div>
 <p style="text-align:center"><a class="btn o" href="#all">Xem toàn bộ kho học liệu →</a></p>`}
let S={cat:"",q:""},D=null;
function paint(){
 const base=D?items.filter(x=>inD(x,D[1])):items,q=S.q.toLowerCase().trim();
 $("chips").innerHTML=`<button class="chip${S.cat?"":" on"}" data-c="">Tất cả (${base.length})</button>`+CATS.map(c=>`<button class="chip${S.cat===c[0]?" on":""}" data-c="${c[0]}">${c[1]} ${c[0]} (${base.filter(x=>x.cat===c[0]).length})</button>`).join("");
 $("lst").innerHTML=itemsHtml(base.filter(x=>(!S.cat||x.cat===S.cat)&&(!q||[x.title,x.sub,x.author,x.desc,x.cat].join(" ").toLowerCase().includes(q))));}
function deptView(d){
 D=d;S={cat:"",q:""};const base=d?items.filter(x=>inD(x,d[1])):items,c=d?d[3]:"#2b7de9";
 $("app").innerHTML=`<div class="ban" style="--c:${c}"><div class="ic">${d?d[2]:"📚"}</div><div><h1>${d?"Kho học liệu "+d[1]:"Toàn bộ kho học liệu"}</h1><div>${base.length} học liệu · ${new Set(base.map(x=>x.author).filter(Boolean)).size} giáo viên · cập nhật ${fd(base[0]&&base[0].at)}</div></div></div>
 <div class="act"><a class="btn" target="_blank" rel="noopener" href="${(()=>{const f=d?(C.DEPT_FOLDERS||{})[d[1]]:C.ROOT;return f?dl(f):"#"})()}">📤 Tải học liệu lên Drive${d?" của "+d[1]:""}</a></div><div class="hint">Đặt tên tệp: họ và tên_tổ chuyên môn_môn_lớp.2026</div>
 <div class="chips" id="chips"></div><input id="q" type="search" placeholder="Tìm học liệu, môn, khối, giáo viên…"><div id="lst"></div>
 <h2>🕒 Dòng thời gian tải lên</h2><div class="pn">${tline(base.slice(0,15))}</div>`;
 $("q").oninput=e=>{S.q=e.target.value;paint()};
 $("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;S.cat=b.dataset.c;paint()};paint()}
function admin(){
 $("app").innerHTML=`<div class="ban" style="--c:#0b2a57"><div class="ic">⚙️</div><div><h1>QUẢN TRỊ - TỔ CHUYỂN ĐỔI SỐ</h1><div>Chọn tổ / bộ phận để tải học liệu lên Drive</div></div></div>
 <div class="hint" style="margin-top:10px">Đặt tên tệp: <b>họ và tên_tổ chuyên môn_môn_lớp.2026</b> (để kho tự ghi đúng giáo viên và môn). Tải xong, học liệu tự hiện trên web sau vài phút.</div>
 <div class="ug">${DEPTS.map(d=>`<a class="tile" target="_blank" rel="noopener" href="${(C.DEPT_FOLDERS||{})[d[1]]?dl(C.DEPT_FOLDERS[d[1]]):"#"}" style="--c:${d[3]}"><div class="ic">${d[2]}</div><b>${d[1]}</b><small>📤 Mở thư mục tải lên</small></a>`).join("")}</div>`}
function route(){
 const h=(location.hash||"#home").slice(1),d=DEPTS.find(x=>x[0]===h);
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+h));
 const dd=document.querySelector(".dd");if(dd)dd.classList.remove("open");
 if(h==="all")deptView(null);else if(h==="quantri")admin();else if(d)deptView(d);else home();
 window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
document.querySelector(".ddb").onclick=()=>document.querySelector(".dd").classList.toggle("open");
(async()=>{try{items=C.API_URL?await (await fetch(C.API_URL)).json():C.SHEET_CSV?fromSheet(await (await fetch(C.SHEET_CSV)).text()):await (await fetch("data/resources.json")).json()}catch(e){items=[]}items.sort((a,b)=>b.at-a.at);route()})();
route();
</script></body></html>
